<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Book of the Living · XXI</title>
<link rel="icon" type="image/png" href="favicon_io/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a080c;
    --deep: #100d14;
    --gold: #c9a84c;
    --gold-light: #e8c87a;
    --gold-dim: #7a6130;
    --bone: #f0e8d8;
    --smoke: #c8bfb0;
  }

  body {
    background: var(--black);
    color: var(--bone);
    font-family: 'EB Garamond', Georgia, serif;
    min-height: 100vh;
  }

  /* grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none; z-index: 100; opacity: 0.4;
  }

  .page {
    max-width: 620px;
    margin: 0 auto;
    padding: 60px 28px 80px;
  }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 48px; }

  .cross-row {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    margin-bottom: 28px;
    animation: fadeDown 0.8s ease 0.2s both;
  }
  .cross-row-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim), var(--gold), var(--gold-dim)); max-width: 140px; }
  .cross-row-line.r { background: linear-gradient(to left, transparent, var(--gold-dim), var(--gold), var(--gold-dim)); }
  .cross-sym { font-size: 22px; color: var(--gold); animation: glow 3s ease-in-out infinite; }

  .page-eyebrow {
    font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 6px;
    text-transform: uppercase; color: var(--gold-dim); margin-bottom: 14px;
    animation: fadeDown 0.8s ease 0.3s both;
  }

  .page-title {
    font-family: 'Cinzel Decorative', serif; font-size: clamp(22px, 6vw, 36px);
    font-weight: 700; color: var(--gold);
    text-shadow: 0 0 30px rgba(201,168,76,0.25);
    line-height: 1.2; margin-bottom: 10px;
    animation: fadeUp 0.9s ease 0.4s both;
  }

  .page-sub {
    font-family: 'EB Garamond', serif; font-style: italic;
    font-size: 16px; color: var(--smoke); letter-spacing: 1px;
    animation: fadeUp 0.8s ease 0.5s both;
  }

  /* ── DIVIDER ── */
  .divider {
    display: flex; align-items: center; gap: 0; margin: 32px 0;
    animation: fadeUp 0.8s ease 0.6s both;
  }
  .div-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim) 40%, var(--gold) 50%, var(--gold-dim) 60%, transparent); }
  .div-orn { padding: 0 14px; font-size: 13px; color: var(--gold); }

  /* ── COUNT BADGE ── */
  .count-row {
    text-align: center; margin-bottom: 36px;
    animation: fadeUp 0.8s ease 0.7s both;
  }
  .count-label { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 6px; }
  .count-number { font-family: 'Cinzel Decorative', serif; font-size: 48px; font-weight: 700; color: var(--gold); text-shadow: 0 0 30px rgba(201,168,76,0.3); line-height: 1; }
  .count-souls { font-family: 'EB Garamond', serif; font-style: italic; font-size: 14px; color: var(--smoke); margin-top: 4px; }

  /* ── LIST ── */
  .guest-list {
    list-style: none;
    animation: fadeUp 0.8s ease 0.8s both;
  }

  .guest-item {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(201,168,76,0.1);
    transition: background 0.3s;
    position: relative;
  }
  .guest-item:first-child { border-top: 1px solid rgba(201,168,76,0.1); }
  .guest-item:hover { background: rgba(201,168,76,0.025); }

  .guest-num {
    font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px;
    color: var(--gold-dim); min-width: 28px; text-align: right; flex-shrink: 0;
  }

  .guest-cross { font-size: 11px; color: var(--gold-dim); flex-shrink: 0; opacity: 0.6; }

  .guest-name {
    font-family: 'EB Garamond', serif; font-size: 20px;
    color: var(--bone); flex: 1; letter-spacing: 0.5px;
  }

  .guest-time {
    font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 2px;
    color: var(--gold-dim); flex-shrink: 0; opacity: 0.7;
    text-transform: uppercase;
  }

  /* empty state */
  .empty-state {
    text-align: center; padding: 60px 0;
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-cross { font-size: 28px; color: var(--gold-dim); display: block; margin-bottom: 16px; }
  .empty-title { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 10px; }
  .empty-sub { font-family: 'EB Garamond', serif; font-style: italic; font-size: 16px; color: var(--smoke); }

  /* ── FOOTER ── */
  .footer {
    text-align: center; margin-top: 48px;
    border-top: 1px solid rgba(201,168,76,0.12);
    padding-top: 28px;
  }
  .footer-cross { font-size: 16px; color: var(--gold-dim); display: block; margin-bottom: 8px; }
  .footer-text { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 4px; color: var(--gold-dim); text-transform: uppercase; }

  /* back link */
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--gold-dim);
    text-decoration: none; margin-bottom: 40px;
    transition: color 0.3s;
    animation: fadeDown 0.8s ease 0.1s both;
  }
  .back-link:hover { color: var(--gold); }

  /* ── ADMIN: clear button (subtle) ── */
  .admin-row {
    text-align: center; margin-top: 20px;
  }
  .clear-btn {
    font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 3px;
    text-transform: uppercase; color: rgba(122,97,48,0.4);
    background: none; border: none; cursor: pointer;
    padding: 4px 8px; transition: color 0.3s;
  }
  .clear-btn:hover { color: var(--gold-dim); }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 16px rgba(201,168,76,0.4); }
    50%       { text-shadow: 0 0 32px rgba(201,168,76,0.8); }
  }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(14px);  } to { opacity: 1; transform: translateY(0); } }

  /* entry animation for new items */
  @keyframes entrySlide {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .guest-item { animation: entrySlide 0.4s ease both; }
</style>
</head>
<body>
<div class="page">

  <a class="back-link" href="index">← Return to the Invitation</a>

  <header class="header">
    <div class="cross-row">
      <div class="cross-row-line"></div>
      <span class="cross-sym">✝&#xFE0E;</span>
      <div class="cross-row-line r"></div>
    </div>
    <p class="page-eyebrow">Anno Domini MMXXVI</p>
    <h1 class="page-title">The Book<br>of the Living</h1>
    <p class="page-sub">Those who are probably not Gay</p>
  </header>

  <div class="divider">
    <div class="div-line"></div>
    <div class="div-orn">❧</div>
    <div class="div-line"></div>
  </div>

  <div class="count-row">
    <p class="count-label">Souls Confirmed</p>
    <p class="count-number" id="countNum">?</p>
    <p class="count-souls" id="countLabel">awaiting the faithful</p>
  </div>

  <div class="divider" style="margin-top:0;">
    <div class="div-line"></div>
    <div class="div-orn">✦</div>
    <div class="div-line"></div>
  </div>

  <ul class="guest-list" id="guestList"></ul>

  <div class="empty-state" id="emptyState">
    <span class="empty-cross">✝&#xFE0E;</span>
    <p class="empty-title">The book lies empty</p>
    <p class="empty-sub">No soul has yet confessed their attendance.</p>
  </div>

  <div class="admin-row">
    <button class="clear-btn" id="clearBtn" title="Clear all RSVPs"></button>
  </div>

  <footer class="footer">
    <span class="footer-cross">✝&#xFE0E;</span>
    <p class="footer-text">XXI · Birthday Mass · 9 May MMXXVI</p>
  </footer>

</div>

<script>
  // PASTE YOUR GOOGLE SCRIPT URL BELOW
  const GITHUB_PAGES_URL = "https://script.google.com/macros/s/AKfycbxkkRNg8P7-ZsYm6Zv6zo0X0t3_BX3tz_lJNymrqZkmp4T8irZtpg0K78442v2PCTTU3g/exec";

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${d.getDate()}/${d.getMonth()+1} · ${h}:${m}`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function fetchAndRender() {
    const list   = document.getElementById('guestList');
    const empty  = document.getElementById('emptyState');
    const countNum   = document.getElementById('countNum');
    const countLabel = document.getElementById('countLabel');

    // Show a loading state while fetching from Google
    countLabel.textContent = "consulting the archives...";

    try {
      const response = await fetch(GITHUB_PAGES_URL);
      const guests = await response.json();

      countNum.textContent = guests.length;
      countLabel.textContent = guests.length === 1
        ? 'People are not Gay'
        : guests.length === 0
          ? 'awaiting the faithful'
          : 'souls have pledged their presence';

      list.innerHTML = '';

      if (guests.length === 0) {
        empty.classList.add('show');
        return;
      }

      empty.classList.remove('show');

      guests.forEach((g, i) => {
        const li = document.createElement('li');
        li.className = 'guest-item';
        li.style.animationDelay = `${i * 0.06}s`;
        li.innerHTML = `
          <span class="guest-num">${String(i + 1).padStart(2, '0')}</span>
          <span class="guest-cross">✝&#xFE0E;</span>
          <span class="guest-name">${escapeHtml(g.name)}</span>
          <span class="guest-time">${formatTime(g.timestamp)}</span>
        `;
        list.appendChild(li);
      });
    } catch (error) {
      console.error("Error fetching the book:", error);
      countLabel.textContent = "the connection is severed. please refresh.";
    }
  }

  // Hide the clear button for security (manage deletions directly in Google Sheets)
  document.getElementById('clearBtn').style.display = 'none';

  // Load the data as soon as the page opens
  fetchAndRender();
</script>
</body>
</html>
